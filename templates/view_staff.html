<!DOCTYPE html>
<html>
<head>
<title>Staff Allocation</title>

<style>
body{
    font-family:Arial;
    background:#e3f2fd;
}

table{
    width:80%;
    margin:40px auto;
    border-collapse:collapse;
    background:white;
}

th,td{
    border:1px solid #1e88e5;
    padding:10px;
    text-align:center;
}

th{
    background:#0d47a1;
    color:white;
}
</style>

</head>

<body>

<h2 style="text-align:center">Staff Allocation</h2>

<table>
<tr>
<th>Batch</th>
<th>Subject</th>
<th>Lab</th>
<th>Date</th>
<th>Time</th>
<th>Internal</th>
<th>External</th>
</tr>

{% for r in staff %}
<tr>
<td>{{ r.batch_id }}</td>
<td>{{ r.subject }}</td>
<td>{{ r.lab_name }}</td>
<td>{{ r.exam_date }}</td>
<td>{{ r.session_time }}</td>
<td>{{ r.internal_staff }}</td>
<td>{{ r.external_staff }}</td>
</tr>
{% endfor %}

<center style="margin:20px;">
<a href="/export_staff_excel">
<button>Download Excel</button>
</a>
</center>

</table>

</body>
</html>
